services:
  backend:
    build: ./fastapi_backend
    container_name: collabspace-backend
    ports:
      - "8000:8000"
    environment:
      JWT_SECRET: change-me-in-production
    volumes:
      - db_data:/app/data

  frontend:
    build: ./nextjs-frontend
    container_name: collabspace-frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api

volumes:
  db_data:
