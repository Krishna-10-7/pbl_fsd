services:
  postgres:
    image: postgres:16-alpine
    container_name: collabspace-postgres
    environment:
      POSTGRES_DB: collabspace
      POSTGRES_USER: collabspace
      POSTGRES_PASSWORD: collabspace
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: collabspace-redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: collabspace-backend
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://collabspace:collabspace@postgres:5432/collabspace
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    container_name: collabspace-frontend
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  pg_data:
